<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>MediaDownloader</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; }
  body { margin: 0; padding: 24px; }
  h1 { margin: 0 0 12px; font-size: 20px; }
  li { margin-bottom: 8px; }
  .actions { display: flex; gap: 8px; margin-top: 20px; }
  button { min-height: 40px; padding: 0 18px; border-radius: 7px; font: 600 15px system-ui; cursor: pointer; }
  #allow { border: 0; background: #0060df; color: #fff; }
  #allow:hover { background: #0250bb; }
  #cancel { border: 1px solid #8f8f9d; background: none; color: inherit; }
  button:focus-visible { outline: 2px solid #80baff; outline-offset: 3px; }
</style>
</head>
<body>
<h1 data-i18n="consent.title"></h1>
<p data-i18n="consent.intro"></p>
<ul>
  <li data-i18n="consent.sites"></li>
  <li data-i18n="consent.headers"></li>
  <li data-i18n="consent.cookies"></li>
  <li data-i18n="consent.downloads"></li>
</ul>
<p data-i18n="consent.privacy"></p>
<div class="actions"><button id="allow" type="button" data-i18n="consent.allow"></button><button id="cancel" type="button" data-i18n="action.cancel"></button></div>
<script src="../i18n.js"></script>
<script src="../lib.js"></script>
<script src="consent.js"></script>
</body>
</html>
