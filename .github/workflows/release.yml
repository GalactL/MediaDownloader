name: Release multiplateforme

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Doit suivre la version du projet (voir CLAUDE.md) ; sert aux noms d'archives.
  VERSION: v0.6.0
  # Une archive ne contient aucun binaire tiers : l'installateur télécharge Deno, yt-dlp et FFmpeg (engine/deps.json).
  MAX_ARCHIVE_BYTES: "1048576"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lire la version de Deno épinglée
        id: deno
        run: node -e "console.log('version=' + require('./engine/deps.json').platforms['linux-x86_64'].find(e => e.name === 'deno').version)" >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ steps.deno.outputs.version }}
      - name: Vérifier les types
        run: deno check engine/*.ts engine/test/*.ts tests/fake-tools/*.ts
      - name: Tester le moteur
        run: deno test -A engine/test
      - name: Vérifier la syntaxe des scripts shell
        run: |
          sh -n packaging/install.sh
          sh -n packaging/uninstall.sh
          sh -n packaging/MediaDownloader.Cli
      - name: Tests de l'extension
        run: node --test extension/test/*.test.js tools/fetch-signed-xpi.test.mjs

  extension:
    # AMO refuse de signer deux fois la même version : ne jamais signer avant que les tests passent.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Signe (ou vérifie) une seule fois ; le job package refait le .xpi lui-même (aucun artefact GitHub).
      - name: Signer l'extension
        shell: bash
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: tools/make-xpi.sh

  package:
    needs: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruire l'extension Firefox
        # Déjà signée par le job extension : fetch-signed-xpi la retrouve, aucune seconde signature.
        shell: bash
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: tools/make-xpi.sh
      - name: Construire l'extension Chromium
        # Opera, Chrome et Brave : zip non signé à charger en mode développeur (README.txt), sans secret.
        run: tools/make-chromium-zip.sh
      - name: Assembler les archives
        # Windows : .zip (les droits Unix n'y comptent pas). Linux : .tar.gz, qui conserve le bit exécutable des scripts.
        shell: bash
        run: |
          set -euo pipefail
          stage() { # nom, lanceur, notice, scripts d'installation...
            local name="$1" launcher="$2" readme="$3"; shift 3
            local dir="package/$name"
            mkdir -p "$dir"
            cp -r engine "$dir/engine"
            rm -rf "$dir/engine/test"
            cp "packaging/$launcher" "$dir/$launcher"
            for f in "$@"; do cp "packaging/$f" "$dir/$f"; done
            cp out/mediadownloader.xpi out/mediadownloader-chromium.zip "$dir/"
            cp "$readme" "$dir/README.txt"
          }
          win="MediaDownloader-$VERSION-Windows-x64"
          lin="MediaDownloader-$VERSION-Linux-x64"
          stage "$win" MediaDownloader.Cli.bat docs/RELEASE_WINDOWS.md Installer.bat Desinstaller.bat
          stage "$lin" MediaDownloader.Cli docs/RELEASE_LINUX.md install.sh uninstall.sh
          chmod 755 "package/$lin/MediaDownloader.Cli" "package/$lin/install.sh" "package/$lin/uninstall.sh"
          (cd package && zip -X -q -r "$win.zip" "$win")
          tar -C package --owner=0 --group=0 --numeric-owner -czf "package/$lin.tar.gz" "$lin"
          ls -l package/*.zip package/*.tar.gz
          tar -tvzf "package/$lin.tar.gz"
          unzip -l "package/$win.zip"
      - name: Contrôler la taille et l'absence de binaire tiers
        shell: bash
        run: |
          set -euo pipefail
          for f in package/*.zip package/*.tar.gz; do
            size=$(stat -c %s "$f")
            echo "$f : $size octets"
            if [ "$size" -ge "$MAX_ARCHIVE_BYTES" ]; then echo "::error::$f dépasse 1 Mio : un binaire s'y est glissé ?"; exit 1; fi
          done
          if tar -tzf "package/MediaDownloader-$VERSION-Linux-x64.tar.gz" | grep -E '(^|/)tools/'; then
            echo "::error::l'archive Linux ne doit pas contenir tools/"; exit 1
          fi
          if unzip -Z1 "package/MediaDownloader-$VERSION-Windows-x64.zip" | grep -E '(^|/)tools/|\.(exe|dll)$'; then
            echo "::error::l'archive Windows ne doit contenir ni tools/ ni exe/dll"; exit 1
          fi
      # Pas d'artefacts GitHub (quota de stockage) : un seul job publie tout sur la release.
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            package/*.zip
            package/*.tar.gz
            out/mediadownloader.xpi
            out/mediadownloader-chromium.zip
