name: Release multiplateforme

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Garder synchronisé avec tools/install-dependencies.ps1
  DENO_VERSION: "2.5.6"
  # Build FFmpeg statique GPL embarqué dans l'archive Linux (BtbN/FFmpeg-Builds)
  FFMPEG_ASSET: ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configurer
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compiler
        run: cmake --build build --config Release --parallel
      - name: Tester
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Tests de l'extension
        run: node --test extension/test/*.test.js tools/fetch-signed-xpi.test.mjs

  extension:
    # AMO refuse de signer deux fois la même version : ne jamais signer avant que les tests passent.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Récupérer les composants du mode léger
        # Pyodide, yt-dlp, QuickJS et ffmpeg-core.wasm aux versions et sommes SHA-256 épinglées ; absents du dépôt, requis dans le .xpi.
        run: node tools/fetch-lite-assets.mjs
      # Signe (ou vérifie) une seule fois ; chaque job build refait le .xpi lui-même (aucun artefact GitHub).
      - name: Signer l'extension
        shell: bash
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: tools/make-xpi.sh

  build:
    needs: extension
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MediaDownloader-v0.6.0-Windows-x64
            readme: docs/RELEASE_WINDOWS.md
          - os: ubuntu-latest
            artifact: MediaDownloader-v0.6.0-Linux-x64
            deno: x86_64-unknown-linux-gnu
            readme: docs/RELEASE_LINUX.md
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Télécharger les dépendances Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/install-dependencies.ps1
      - name: Configurer
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compiler
        run: cmake --build build --config Release --parallel
      - name: Tester
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Installer
        run: cmake --install build --config Release --prefix package/${{ matrix.artifact }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Récupérer les composants du mode léger
        shell: bash
        run: node tools/fetch-lite-assets.mjs
      - name: Reconstruire l'extension Firefox
        # Déjà signée par le job extension : fetch-signed-xpi la retrouve, aucune seconde signature.
        shell: bash
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          tools/make-xpi.sh
          cp out/mediadownloader.xpi "package/${{ matrix.artifact }}/mediadownloader.xpi"
      - name: Construire l'extension Chromium
        # Opera, Chrome et Brave : zip non signé à charger en mode développeur (README.txt), sans secret.
        shell: bash
        run: |
          tools/make-chromium-zip.sh
          cp out/mediadownloader-chromium.zip "package/${{ matrix.artifact }}/mediadownloader-chromium.zip"
      - name: Archive des sources (GPL)
        # Offre de sources de ffmpeg-core.wasm (GPL), jointe une seule fois à la release (voir docs/RELEASE_*.md).
        if: runner.os == 'Linux'
        shell: bash
        run: git archive --format=tar.gz --prefix="MediaDownloader-${GITHUB_REF_NAME}/" -o "out/MediaDownloader-sources-${GITHUB_REF_NAME}.tar.gz" HEAD
      - name: Ajouter les scripts d'installation
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cp packaging/Installer.bat packaging/Desinstaller.bat "package/${{ matrix.artifact }}/"
          else
            cp packaging/install.sh packaging/uninstall.sh "package/${{ matrix.artifact }}/"
            chmod +x "package/${{ matrix.artifact }}/install.sh" "package/${{ matrix.artifact }}/uninstall.sh"
          fi
      - name: Ajouter la notice
        shell: bash
        run: cp "${{ matrix.readme }}" "package/${{ matrix.artifact }}/README.txt"
      - name: Ajouter les outils Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "package/${{ matrix.artifact }}/tools" | Out-Null
          Copy-Item -Recurse tools/bin "package/${{ matrix.artifact }}/tools/bin"
      - name: Ajouter Deno
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          asset="deno-${{ matrix.deno }}.zip"
          url="https://github.com/denoland/deno/releases/download/v${DENO_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/$asset" "$url/$asset"
          curl -fsSL -o "$RUNNER_TEMP/$asset.sha256sum" "$url/$asset.sha256sum"
          (cd "$RUNNER_TEMP" && shasum -a 256 -c "$asset.sha256sum")
          mkdir -p "package/${{ matrix.artifact }}/tools/bin"
          unzip -o "$RUNNER_TEMP/$asset" deno -d "package/${{ matrix.artifact }}/tools/bin"
          chmod +x "package/${{ matrix.artifact }}/tools/bin/deno"
      - name: Ajouter yt-dlp et FFmpeg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="package/${{ matrix.artifact }}/tools/bin"
          mkdir -p "$bin"
          # yt-dlp : binaire autonome officiel, vérifié via SHA2-256SUMS de la même release
          ytdlp="https://github.com/yt-dlp/yt-dlp/releases/latest/download"
          curl -fsSL -o "$RUNNER_TEMP/yt-dlp_linux" "$ytdlp/yt-dlp_linux"
          curl -fsSL -o "$RUNNER_TEMP/SHA2-256SUMS" "$ytdlp/SHA2-256SUMS"
          (cd "$RUNNER_TEMP" && grep -E ' yt-dlp_linux$' SHA2-256SUMS | sha256sum -c -)
          install -m 755 "$RUNNER_TEMP/yt-dlp_linux" "$bin/yt-dlp"
          # FFmpeg : build statique GPL (BtbN), branche stable n8.1
          ff="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
          curl -fsSL -o "$RUNNER_TEMP/$FFMPEG_ASSET" "$ff/$FFMPEG_ASSET"
          curl -fsSL -o "$RUNNER_TEMP/checksums.sha256" "$ff/checksums.sha256"
          (cd "$RUNNER_TEMP" && grep -F "  $FFMPEG_ASSET" checksums.sha256 | sha256sum -c -)
          tar -xJf "$RUNNER_TEMP/$FFMPEG_ASSET" -C "$bin" --strip-components=2 --wildcards '*/bin/ffmpeg'
          chmod +x "$bin/ffmpeg"
      - name: Archiver Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "package/${{ matrix.artifact }}/*" -DestinationPath "package/${{ matrix.artifact }}.zip"
      - name: Archiver Unix
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C package -czf "package/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
      # Pas d'artefacts GitHub (quota de stockage) : chaque job ajoute son archive à la release.
      # Les deux jobs créent/complètent la même release en parallèle ; si la création concurrente échoue, relancer le job.
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: package/${{ matrix.artifact }}.*
      # Le .xpi et le zip Chromium seuls ne sont joints que par une entrée de la matrice, pour éviter un conflit d'asset en double.
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
        with:
          files: |
            out/mediadownloader.xpi
            out/mediadownloader-chromium.zip
            out/MediaDownloader-sources-*.tar.gz
