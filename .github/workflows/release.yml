name: Release multiplateforme

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Garder synchronisé avec tools/install-dependencies.ps1
  DENO_VERSION: "2.5.6"
  # Build FFmpeg statique GPL embarqué dans l'archive Linux (BtbN/FFmpeg-Builds)
  FFMPEG_ASSET: ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configurer
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compiler
        run: cmake --build build --config Release --parallel
      - name: Tester
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Tests de l'extension
        run: node --test extension/test/*.test.js

  extension:
    # AMO refuse de signer deux fois la même version : ne jamais signer avant que les tests passent.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Empaqueter et signer l'extension
        shell: bash
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ext-src out
          cp -r extension/. ext-src/
          rm -rf ext-src/test ext-src/README.md
          if [ -n "$WEB_EXT_API_KEY" ] && [ -n "$WEB_EXT_API_SECRET" ]; then
            npx --yes web-ext@8.3.0 sign --channel=unlisted --source-dir ext-src --artifacts-dir signed
            cp signed/*.xpi out/mediadownloader.xpi
          else
            echo "::warning::AMO_JWT_ISSUER/AMO_JWT_SECRET absents : mediadownloader.xpi n'est PAS signé (Firefox stable le refusera)."
            (cd ext-src && zip -r -X ../out/mediadownloader.xpi .)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mediadownloader-xpi
          path: out/mediadownloader.xpi
          if-no-files-found: error

  build:
    needs: extension
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MediaDownloader-v0.5.0-Windows-x64
            readme: docs/RELEASE_WINDOWS.md
          - os: ubuntu-latest
            artifact: MediaDownloader-v0.5.0-Linux-x64
            deno: x86_64-unknown-linux-gnu
            readme: docs/RELEASE_LINUX.md
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Télécharger les dépendances Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/install-dependencies.ps1
      - name: Configurer
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compiler
        run: cmake --build build --config Release --parallel
      - name: Tester
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Installer
        run: cmake --install build --config Release --prefix package/${{ matrix.artifact }}
      - uses: actions/download-artifact@v4
        with:
          name: mediadownloader-xpi
          path: xpi
      - name: Ajouter l'extension Firefox
        shell: bash
        run: cp xpi/mediadownloader.xpi "package/${{ matrix.artifact }}/mediadownloader.xpi"
      - name: Ajouter les scripts d'installation
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cp packaging/Installer.bat packaging/Desinstaller.bat "package/${{ matrix.artifact }}/"
          else
            cp packaging/install.sh packaging/uninstall.sh "package/${{ matrix.artifact }}/"
            chmod +x "package/${{ matrix.artifact }}/install.sh" "package/${{ matrix.artifact }}/uninstall.sh"
          fi
      - name: Ajouter la notice
        shell: bash
        run: cp "${{ matrix.readme }}" "package/${{ matrix.artifact }}/README.txt"
      - name: Ajouter les outils Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "package/${{ matrix.artifact }}/tools" | Out-Null
          Copy-Item -Recurse tools/bin "package/${{ matrix.artifact }}/tools/bin"
      - name: Ajouter Deno
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          asset="deno-${{ matrix.deno }}.zip"
          url="https://github.com/denoland/deno/releases/download/v${DENO_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/$asset" "$url/$asset"
          curl -fsSL -o "$RUNNER_TEMP/$asset.sha256sum" "$url/$asset.sha256sum"
          (cd "$RUNNER_TEMP" && shasum -a 256 -c "$asset.sha256sum")
          mkdir -p "package/${{ matrix.artifact }}/tools/bin"
          unzip -o "$RUNNER_TEMP/$asset" deno -d "package/${{ matrix.artifact }}/tools/bin"
          chmod +x "package/${{ matrix.artifact }}/tools/bin/deno"
      - name: Ajouter yt-dlp et FFmpeg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="package/${{ matrix.artifact }}/tools/bin"
          mkdir -p "$bin"
          # yt-dlp : binaire autonome officiel, vérifié via SHA2-256SUMS de la même release
          ytdlp="https://github.com/yt-dlp/yt-dlp/releases/latest/download"
          curl -fsSL -o "$RUNNER_TEMP/yt-dlp_linux" "$ytdlp/yt-dlp_linux"
          curl -fsSL -o "$RUNNER_TEMP/SHA2-256SUMS" "$ytdlp/SHA2-256SUMS"
          (cd "$RUNNER_TEMP" && grep -E ' yt-dlp_linux$' SHA2-256SUMS | sha256sum -c -)
          install -m 755 "$RUNNER_TEMP/yt-dlp_linux" "$bin/yt-dlp"
          # FFmpeg : build statique GPL (BtbN), branche stable n8.1
          ff="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
          curl -fsSL -o "$RUNNER_TEMP/$FFMPEG_ASSET" "$ff/$FFMPEG_ASSET"
          curl -fsSL -o "$RUNNER_TEMP/checksums.sha256" "$ff/checksums.sha256"
          (cd "$RUNNER_TEMP" && grep -F "  $FFMPEG_ASSET" checksums.sha256 | sha256sum -c -)
          tar -xJf "$RUNNER_TEMP/$FFMPEG_ASSET" -C "$bin" --strip-components=2 --wildcards '*/bin/ffmpeg'
          chmod +x "$bin/ffmpeg"
      - name: Archiver Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "package/${{ matrix.artifact }}/*" -DestinationPath "package/${{ matrix.artifact }}.zip"
      - name: Archiver Unix
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C package -czf "package/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/${{ matrix.artifact }}.*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
