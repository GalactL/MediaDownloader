name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Télécharger les dépendances Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/install-dependencies.ps1
      - name: Configurer
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compiler
        run: cmake --build build --config Release --parallel
      - name: Tester
        run: ctest --test-dir build -C Release --output-on-failure

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de l'extension
        run: node --test extension/test/*.test.js
      - name: Vérifier la syntaxe JS et le manifeste
        shell: bash
        run: |
          set -euo pipefail
          for f in extension/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
